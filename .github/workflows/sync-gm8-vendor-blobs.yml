name: Sync GM8 vendor blobs

on:
  push:
    branches:
      - lineage-18.1-rework
    paths:
      - .github/workflows/sync-gm8-vendor-blobs.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-22.04
    env:
      BLOB_MANIFEST: |
        f11c9f3adb9d216203fc2b027e7000611b5314fc  proprietary/vendor/lib/libcpion.so
        8d7eafd68db9bbe7ec7a5c4d547f026869766081  proprietary/vendor/etc/vintf/manifest/android.hardware.gnss@2.0-service-qti.xml
        9b2f6691d6c224bcb9ab9a0d57adfb9e52f1b53e  proprietary/vendor/etc/vintf/manifest/vendor.qti.gnss@3.0-service.xml
        2fbfffb280becb4c890787958d5471c887e0e29e  proprietary/product/lib/vendor.qti.gnss@1.0.so
        3f185bf7c146a8f77fe6c35d57358e7c64b15ac2  proprietary/product/lib/vendor.qti.gnss@1.1.so
        020509617283c8323c71c1eec955b7a09d62aa89  proprietary/product/lib/vendor.qti.gnss@1.2.so
        ef5e1e3718cd71a01a4ca7b06f38d56b6aca50aa  proprietary/product/lib/vendor.qti.gnss@2.0.so
        c7eeb37d061f7978624810ccc1d1d7f25e9f95da  proprietary/product/lib/vendor.qti.gnss@2.1.so
        e4f5a7fd2dcdf56f8d69e4d0b27e996812ebd295  proprietary/product/lib/vendor.qti.gnss@3.0.so
        bf11e2b7a104ed1689623f5a772269d24e00bd14  proprietary/product/lib64/vendor.qti.gnss@1.0.so
        4b88888fcba1bc3f709889cbf086d9ba2b997b91  proprietary/product/lib64/vendor.qti.gnss@1.1.so
        8073a3bfcfdc7aaf903852349bbbcd9e5d229d3e  proprietary/product/lib64/vendor.qti.gnss@1.2.so
        f6f94bf22b8948c163b84cf092d86fdd25b39850  proprietary/product/lib64/vendor.qti.gnss@2.0.so
        7f69b6098f779f6ed396bbf366b496b0b228c743  proprietary/product/lib64/vendor.qti.gnss@2.1.so
        c5ed668d324e7c898ca026fc12dad8829cd8a944  proprietary/product/lib64/vendor.qti.gnss@3.0.so
        7f7006829005658c9b89c61ac02f107d3d6fe470  proprietary/vendor/bin/hw/android.hardware.gnss@2.0-service-qti
        8e0b0596a13b8d653e6f5415c41d8a53bb12b73a  proprietary/vendor/etc/init/android.hardware.gnss@2.0-service-qti.rc
        e286b6a06bf3ad0141547c67c62a1ad826992633  proprietary/vendor/lib/hw/android.hardware.gnss@2.0-impl-qti.so
        691871a3cb7491c413a8492ffd74372f10d6d998  proprietary/vendor/lib/hw/vendor.qti.gnss@3.0-impl.so
        b7801ba2168212470628e609afc245826e85cca7  proprietary/vendor/lib/libbatching.so
        3235841ae4b550398c988e4eb04840f4aa17fa9a  proprietary/vendor/lib/libgeofencing.so
        f75c06d15c57b690ebe6568ed20058b34d12f289  proprietary/vendor/lib/vendor.qti.gnss@3.0-service.so
        e4f5a7fd2dcdf56f8d69e4d0b27e996812ebd295  proprietary/vendor/lib/vendor.qti.gnss@3.0.so
        02717939c65794f29ab10bb8175081dbcfde0327  proprietary/vendor/lib64/hw/android.hardware.gnss@2.0-impl-qti.so
        2328835a0e0221a527c8e55c72e1a0dcef3fcfbe  proprietary/vendor/lib64/hw/vendor.qti.gnss@3.0-impl.so
        d46350976bb1d3dfd1e9d354c176290eb1284a42  proprietary/vendor/lib64/libbatching.so
        f494603d4c6a440aa63864ef7c2c9a0721d5aac8  proprietary/vendor/lib64/libgarden_haltests_e2e.so
        57f23c8de2503824e9b05e9c49fae2aecf3f7e9d  proprietary/vendor/lib64/libgeofencing.so
        55420caca27bcafa785f7c9698d622cc56a619e8  proprietary/vendor/lib64/libqdma.so
        8bb728b595a3bac39cdbd3c456d523f35a10ef1d  proprietary/vendor/lib64/libqdma_file_agent.so
        6b3c387f31f4cb91c8907362af4daa3f0cad7911  proprietary/vendor/lib64/vendor.qti.gnss@3.0-service.so
        c5ed668d324e7c898ca026fc12dad8829cd8a944  proprietary/vendor/lib64/vendor.qti.gnss@3.0.so
        d71bdb2f8eb9c51e443c4168564afbd052a239ff  proprietary/vendor/lib/libaoa.so
        9642aeb89c1575097da211eef93f822e2a6f144a  proprietary/vendor/lib64/libaoa.so

    steps:
      - name: Checkout target vendor
        uses: actions/checkout@v4
        with:
          ref: lineage-18.1-rework
          fetch-depth: 0

      - name: Fetch known Android 11 compatibility vendor
        run: |
          git clone --depth=1 --branch arrow-11.0 \
            https://github.com/ArrowOS-Devices/android_vendor_gm_GM8_sprout.git \
            /tmp/gm8-vendor-source

      - name: Restore and verify missing blobs
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            [ -n "${expected:-}" ] || continue
            source_path="/tmp/gm8-vendor-source/$path"
            test -f "$source_path"
            actual="$(sha1sum "$source_path" | awk '{print $1}')"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::SHA-1 mismatch: expected $expected, got $actual"
              exit 1
            fi
            mkdir -p "$(dirname "$path")"
            cp -a "$source_path" "$path"
          done <<< "$BLOB_MANIFEST"
          echo "All expected blobs matched their SHA-1 values."

      - name: Commit restored vendor blobs
        shell: bash
        run: |
          set -euo pipefail
          git add proprietary/
          if git diff --cached --quiet --exit-code; then
            echo "Vendor blobs are already synchronized."
            exit 0
          fi
          git config user.name "GM8 Vendor Sync"
          git config user.email "gm8-vendor-sync@users.noreply.github.com"
          git commit -m "GM8_sprout: Restore missing Android 11 vendor blobs"
          git push origin HEAD:lineage-18.1-rework
